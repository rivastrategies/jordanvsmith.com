<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jordan V. Smith | Riva Strategies</title>
  <meta name="description" content="Contact card for Jordan V. Smith, Founder of Riva Strategies and Fractional Sales & Marketing Director.">
  <style>
    :root {
      color-scheme: light;
      --accent: #081d3a;
      --accent-contrast: #ffffff;
      --accent-glow: rgba(8, 29, 58, 0.12);
      --highlight: #c99a2d;
      --surface: #ffffff;
      --surface-soft: #f3f6fb;
      --text-primary: #0b1f3a;
      --text-secondary: #4f5b6d;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--surface-soft), #ffffff 55%);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 18px;
    }
    .card {
      width: min(520px, 100%);
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding: 36px 32px;
      background: var(--surface);
      border-radius: 28px;
      box-shadow: 0 32px 64px var(--accent-glow);
      border: 2px solid rgba(201, 154, 45, 0.18);
    }
    .identity {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 20px;
      align-items: center;
    }
    .identity img {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(201, 154, 45, 0.65);
      box-shadow: 0 12px 20px rgba(8, 29, 58, 0.2);
    }
    .identity h1 {
      font-size: 1.7rem;
      margin: 0 0 6px;
      letter-spacing: 0.01em;
    }
    .identity .role {
      margin: 0;
      font-size: 0.94rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .identity .subtext {
      margin: 12px 0 0;
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .logo {
      display: flex;
      justify-content: flex-start;
      padding-top: 8px;
    }
    .logo img {
      max-width: 120px;
      max-height: 36px;
      object-fit: contain;
      opacity: 0.7;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .action {
      display: inline-block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 14px;
      text-decoration: none;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      background: rgba(8, 29, 58, 0.05);
      color: var(--text-primary);
      border: 1px solid rgba(8, 29, 58, 0.08);
      box-shadow: 0 10px 16px rgba(8, 29, 58, 0.08);
    }
    .action:active {
      transform: scale(0.98);
    }
    .action.primary {
      background: var(--accent);
      color: var(--accent-contrast);
      font-size: 1.05rem;
      padding: 18px 20px;
      border: 0;
      box-shadow: 0 16px 24px rgba(8, 29, 58, 0.25);
    }
    .action[href^="https"] {
      color: var(--accent);
    }
    .action:hover {
      box-shadow: 0 12px 20px rgba(8, 29, 58, 0.15);
    }
    @media (max-width: 480px) {
      body {
        padding: 32px 14px;
      }
      .identity {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 18px;
      }
      .identity img {
        width: 80px;
        height: 80px;
        margin: 0 auto;
      }
      .logo {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="identity">
      <img src="/assets/jordan.jpg" alt="Portrait of Jordan V. Smith">
      <div>
        <h1>Jordan V. Smith</h1>
        <p class="role">Founder | Riva Strategies | Fractional Sales &amp; Marketing Director</p>
        <p class="subtext">I build and execute revenue growth systems for hospitality, service, and local market leaders.</p>
      </div>
    </section>
    <aside class="logo">
      <img src="/assets/riva-logo.png" alt="Riva Strategies logo">
    </aside>
    <nav class="actions" aria-label="Primary contact actions">
      <a class="action primary" href="/jordan.vcf" download>Save Contact</a>
      <a class="action" href="tel:8323884600">Call</a>
      <a class="action" href="sms:8323884600">Text</a>
      <a class="action" href="tel:8329050570">Call Office</a>
      <a class="action" href="mailto:rivastrategies@gmail.com">Email</a>
      <a class="action" href="https://rivastrategies.com" target="_blank" rel="noopener">View Riva Strategies</a>
      <a class="action" href="https://www.linkedin.com" target="_blank" rel="noopener">LinkedIn</a>
    </nav>
  </main>
</body>
</html>
